<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - BYOK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 12px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 18px;
            color: #fff;
            margin-right: auto;
        }
        select, input[type="password"] {
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
            min-width: 140px;
        }
        select:focus, input:focus {
            border-color: #6366f1;
        }
        input[type="password"] {
            min-width: 200px;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #6366f1;
            color: white;
        }
        .message.assistant {
            align-self: flex-start;
            background: #1a1a1a;
            border: 1px solid #333;
        }
        .message.assistant pre {
            background: #0d0d0d;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .message.assistant code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
        }
        .message.assistant p { margin: 4px 0; }
        .message.assistant ul, .message.assistant ol { margin: 8px 0; padding-left: 20px; }
        .input-area {
            padding: 16px 20px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            gap: 12px;
        }
        .input-area textarea {
            flex: 1;
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 48px;
            max-height: 120px;
            font-family: inherit;
        }
        .input-area textarea:focus {
            border-color: #6366f1;
        }
        .input-area button {
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .input-area button:hover { opacity: 0.9; }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #6366f1;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .empty-state {
            text-align: center;
            color: #666;
            margin: auto;
        }
        .empty-state h2 {
            color: #999;
            margin-bottom: 8px;
        }
        .settings-btn {
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
        }
        .settings-btn:hover { border-color: #6366f1; }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
        }
        .modal h2 {
            margin-bottom: 16px;
            color: #fff;
        }
        .modal label {
            display: block;
            margin: 12px 0 6px;
            font-size: 13px;
            color: #999;
        }
        .modal input, .modal select {
            width: 100%;
            padding: 10px 12px;
        }
        .modal .actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .modal .actions button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 13px;
        }
        .modal .actions .save { background: #6366f1; color: white; }
        .modal .actions .cancel { background: #2a2a2a; color: #e0e0e0; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AI Chat</h1>
        <select id="providerSelect">
            <option value="">Select Provider</option>
            <option value="gemini">Google Gemini</option>
            <option value="groq">Groq</option>
        </select>
        <select id="modelSelect" disabled>
            <option value="">Select Model</option>
        </select>
        <button class="settings-btn" onclick="openSettings()">⚙️ API Keys</button>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="empty-state">
            <h2>Welcome to AI Chat</h2>
            <p>Select a provider, choose a model, and enter your API key to start chatting.</p>
        </div>
    </div>

    <div class="input-area">
        <textarea id="messageInput" placeholder="Type your message..." rows="1"></textarea>
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h2>API Keys</h2>
            <label>Gemini API Key</label>
            <input type="password" id="geminiKey" placeholder="AIza...">

            <label>Groq API Key</label>
            <input type="password" id="groqKey" placeholder="gsk_...">

            <p style="font-size: 12px; color: #666; margin-top: 12px;">
                Your keys are stored locally in your browser and never sent to our servers.
            </p>

            <div class="actions">
                <button class="cancel" onclick="closeSettings()">Cancel</button>
                <button class="save" onclick="saveKeys()">Save</button>
            </div>
        </div>
    </div>

    <script src="engine.js"></script>
</body>
</html>
